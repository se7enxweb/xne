# The Exponential Network API v1 inside the network.se7enx.com server block of exp-site-proxy (https, :9444):
# everything under /api/v1/ goes to the xne API's PHP-FPM; the static site and the 301 for other paths stay as they are.
    location ^~ /api/v1/ {
        client_max_body_size 1m;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/xne/server/public/index.php;
        fastcgi_param SCRIPT_NAME /api/v1/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS on;
        fastcgi_param REMOTE_ADDR $proxy_protocol_addr;
        fastcgi_pass unix:/run/xne-api/fpm.sock;
        add_header Cache-Control "no-store" always;
    }
