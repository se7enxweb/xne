; PHP-FPM for the Exponential Network API v1 (xne-api.service): its own master and one small pool, user xne-api, on a
; unix socket only nginx can use. The API code is the xne package; its data is /var/lib/xne-server (0700, xne-api).
[global]
pid = /run/xne-api/fpm.pid
error_log = /var/log/xne-api/fpm.log
daemonize = no

[xne-api]
user = xne-api
group = xne-api
listen = /run/xne-api/fpm.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s
pm.max_requests = 500
request_terminate_timeout = 30s
clear_env = yes
env[XNE_SERVER_DATA] = /var/lib/xne-server
php_admin_value[open_basedir] = /opt/xne:/var/lib/xne-server
php_admin_value[upload_max_filesize] = 1M
php_admin_value[post_max_size] = 1M
php_admin_flag[expose_php] = off
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,popen,proc_open
